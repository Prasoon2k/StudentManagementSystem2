<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn {
            background: #f59e0b;
            color: white;
        }

        .search-btn {
            background: #16a34a;
            color: white;
        }

        .clear-btn {
            background: #6b7280;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1f2937;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: #eef2ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box h3 {
            margin: 5px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid,
            .stats {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Java Project - Web Interface</p>
</header>

<div class="container">

    <div class="card">
        <h2>Student Details</h2>

        <div class="form-grid">
            <div>
                <label>Student ID</label>
                <input type="number" id="studentId" placeholder="Enter ID">
            </div>

            <div>
                <label>Student Name</label>
                <input type="text" id="studentName" placeholder="Enter name">
            </div>

            <div>
                <label>Marks</label>
                <input type="number" id="studentMarks" placeholder="Enter marks">
            </div>
        </div>

        <br>

        <button class="add-btn" onclick="addStudent()">Add Student</button>
        <button class="update-btn" onclick="updateStudent()">Update Student</button>
        <button class="clear-btn" onclick="clearForm()">Clear</button>

        <div class="message" id="message"></div>
    </div>

    <div class="card">
        <h2>Search Student</h2>

        <input type="number" id="searchId" placeholder="Enter Student ID">

        <button class="search-btn" onclick="searchStudent()">Search</button>
        <button class="clear-btn" onclick="displayStudents()">Show All</button>
    </div>

    <div class="card">
        <h2>Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

        <div class="stats">

            <div class="stat-box">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="stat-box">
                <h3>Average Marks</h3>
                <p id="averageMarks">0</p>
            </div>

            <div class="stat-box">
                <h3>Highest Marks</h3>
                <p id="highestMarks">0</p>
            </div>

        </div>
    </div>

</div>

<script>

    let students = JSON.parse(localStorage.getItem("students")) || [];

    function saveStudents() {
        localStorage.setItem("students", JSON.stringify(students));
    }

    function addStudent() {

        let id = Number(document.getElementById("studentId").value);
        let name = document.getElementById("studentName").value.trim();
        let marks = Number(document.getElementById("studentMarks").value);

        if (!id || !name || isNaN(marks)) {
            showMessage("Please enter all student details.");
            return;
        }

        if (marks < 0 || marks > 100) {
            showMessage("Marks must be between 0 and 100.");
            return;
        }

        if (students.some(student => student.id === id)) {
            showMessage("Student ID already exists.");
            return;
        }

        students.push({
            id: id,
            name: name,
            marks: marks
        });

        saveStudents();
        displayStudents();
        clearForm();

        showMessage("Student added successfully.");
    }

    function displayStudents(list = students) {

        let table = document.getElementById("studentTable");

        table.innerHTML = "";

        if (list.length === 0) {
            table.innerHTML =
                "<tr><td colspan='4'>No students found.</td></tr>";
        }

        list.forEach(student => {

            let row = `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.marks}</td>
                    <td>
                        <button class="update-btn"
                        onclick="selectStudent(${student.id})">
                        Edit
                        </button>

                        <button class="delete-btn"
                        onclick="deleteStudent(${student.id})">
                        Delete
                        </button>
                    </td>
                </tr>
            `;

            table.innerHTML += row;
        });

        updateStatistics(list);
    }

    function searchStudent() {

        let id = Number(document.getElementById("searchId").value);

        if (!id) {
            showMessage("Enter a Student ID.");
            return;
        }

        let student = students.find(student => student.id === id);

        if (student) {
            displayStudents([student]);
            showMessage("Student found.");
        } else {
            displayStudents([]);
            showMessage("Student not found.");
        }
    }

    function deleteStudent(id) {

        let confirmation =
            confirm("Are you sure you want to delete this student?");

        if (!confirmation) {
            return;
        }

        students = students.filter(student => student.id !== id);

        saveStudents();
        displayStudents();

        showMessage("Student deleted successfully.");
    }

    function selectStudent(id) {

        let student = students.find(student => student.id === id);

        if (!student) {
            return;
        }

        document.getElementById("studentId").value = student.id;
        document.getElementById("studentName").value = student.name;
        document.getElementById("studentMarks").value = student.marks;

        showMessage("Student selected. Edit the details and click Update.");
    }

    function updateStudent() {

        let id = Number(document.getElementById("studentId").value);
        let name = document.getElementById("studentName").value.trim();
        let marks = Number(document.getElementById("studentMarks").value);

        let student = students.find(student => student.id === id);

        if (!student) {
            showMessage("Student not found.");
            return;
        }

        if (!name || isNaN(marks)) {
            showMessage("Please enter valid details.");
            return;
        }

        if (marks < 0 || marks > 100) {
            showMessage("Marks must be between 0 and 100.");
            return;
        }

        student.name = name;
        student.marks = marks;

        saveStudents();
        displayStudents();
        clearForm();

        showMessage("Student updated successfully.");
    }

    function updateStatistics(list) {

        document.getElementById("totalStudents").textContent =
            list.length;

        if (list.length === 0) {

            document.getElementById("averageMarks").textContent = "0";
            document.getElementById("highestMarks").textContent = "0";

            return;
        }

        let total = 0;
        let highest = list[0];

        list.forEach(student => {

            total += student.marks;

            if (student.marks > highest.marks) {
                highest = student;
            }

        });

        let average = total / list.length;

        document.getElementById("averageMarks").textContent =
            average.toFixed(2);

        document.getElementById("highestMarks").textContent =
            highest.name + " - " + highest.marks;
    }

    function clearForm() {

        document.getElementById("studentId").value = "";
        document.getElementById("studentName").value = "";
        document.getElementById("studentMarks").value = "";
    }

    function showMessage(message) {

        document.getElementById("message").textContent = message;

        setTimeout(() => {
            document.getElementById("message").textContent = "";
        }, 3000);
    }

    displayStudents();

</script>

</body>
</html>
